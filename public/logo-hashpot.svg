<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pot-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background burst -->
  <circle cx="140" cy="100" r="130" fill="url(#burst)"/>

  <!-- Trophy cup body -->
  <path d="M68 90 L78 190 C78 208 105 224 140 224 C175 224 202 208 202 190 L212 90 Z"
        fill="url(#pot-fill)" stroke="url(#gold-grad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Rim -->
  <ellipse cx="140" cy="90" rx="74" ry="14" fill="rgba(245,158,11,0.08)" stroke="url(#gold-grad)" stroke-width="2.5" filter="url(#soft)"/>
  <ellipse cx="140" cy="90" rx="62" ry="10" fill="none" stroke="#f59e0b" stroke-width="0.6" opacity="0.2"/>

  <!-- Base -->
  <rect x="116" y="224" width="48" height="12" rx="4" fill="url(#pot-fill)" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <rect x="104" y="236" width="72" height="10" rx="5" fill="url(#pot-fill)" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>

  <!-- Handles -->
  <path d="M68 98 C34 98 26 132 44 154 C54 166 70 166 78 158" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#soft)" opacity="0.7"/>
  <path d="M212 98 C246 98 254 132 236 154 C226 166 210 166 202 158" fill="none" stroke="#f59e0b" stroke-width="3" filter="url(#soft)" opacity="0.7"/>

  <!-- Decorative band -->
  <path d="M88 145 L192 145" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  <path d="M82 155 L198 155" stroke="#f59e0b" stroke-width="0.5" opacity="0.15"/>

  <!-- Overflowing Bitcoin symbols -->
  <g filter="url(#soft)">
    <text x="100" y="68" font-family="Arial" font-size="22" fill="#fbbf24" opacity="0.85">₿</text>
    <text x="162" y="55" font-family="Arial" font-size="17" fill="#fbbf24" opacity="0.65">₿</text>
    <text x="125" y="45" font-family="Arial" font-size="28" fill="#fbbf24" opacity="0.9">₿</text>
  </g>

  <!-- Sparkles -->
  <g filter="url(#soft)">
    <circle cx="82" cy="48" r="3.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="200" cy="58" r="3" fill="#fbbf24" opacity="0.6"/>
    <circle cx="155" cy="30" r="4" fill="#fbbf24" opacity="0.85"/>
    <circle cx="110" cy="34" r="2.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="185" cy="40" r="3" fill="#fbbf24" opacity="0.7"/>
    <circle cx="140" cy="22" r="2.5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="70" cy="65" r="2" fill="#fbbf24" opacity="0.5"/>
    <circle cx="210" cy="45" r="2" fill="#fbbf24" opacity="0.4"/>
  </g>
</svg>