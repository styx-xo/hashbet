<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c3aff"/>
      <stop offset="100%" stop-color="#bf00ff"/>
    </linearGradient>
    <linearGradient id="hash-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#bf00ff"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Center ambient glow -->
  <circle cx="140" cy="130" r="100" fill="url(#center-glow)"/>

  <!-- Outer hexagonal frame -->
  <polygon points="140,20 235,60 235,180 140,220 45,180 45,60"
           fill="none" stroke="url(#brand-grad)" stroke-width="2.5" filter="url(#glow)" opacity="0.7"/>

  <!-- Inner hexagonal frame -->
  <polygon points="140,42 215,72 215,168 140,198 65,168 65,72"
           fill="rgba(124,58,255,0.04)" stroke="url(#brand-grad)" stroke-width="1.2" opacity="0.3"/>

  <!-- Hash symbol # — centered and bold -->
  <g filter="url(#glow)" transform="translate(140,120)">
    <!-- Vertical bars -->
    <rect x="-28" y="-46" width="8" height="92" rx="4" fill="url(#hash-grad)" opacity="0.9"/>
    <rect x="20" y="-46" width="8" height="92" rx="4" fill="url(#hash-grad)" opacity="0.9"/>
    <!-- Horizontal bars -->
    <rect x="-46" y="-20" width="92" height="8" rx="4" fill="url(#hash-grad)" opacity="0.9"/>
    <rect x="-46" y="12" width="92" height="8" rx="4" fill="url(#hash-grad)" opacity="0.9"/>
  </g>

  <!-- Bitcoin symbol overlay -->
  <text x="140" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="url(#brand-grad)" filter="url(#soft-glow)" opacity="0.45">₿</text>

  <!-- Corner accent nodes -->
  <circle cx="140" cy="20" r="4" fill="#00e5ff" filter="url(#soft-glow)" opacity="0.9"/>
  <circle cx="235" cy="60" r="3" fill="#4a90d9" filter="url(#soft-glow)" opacity="0.6"/>
  <circle cx="235" cy="180" r="3" fill="#7c3aff" filter="url(#soft-glow)" opacity="0.6"/>
  <circle cx="140" cy="220" r="4" fill="#bf00ff" filter="url(#soft-glow)" opacity="0.9"/>
  <circle cx="45" cy="180" r="3" fill="#7c3aff" filter="url(#soft-glow)" opacity="0.6"/>
  <circle cx="45" cy="60" r="3" fill="#4a90d9" filter="url(#soft-glow)" opacity="0.6"/>
</svg>